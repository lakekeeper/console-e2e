# Backend stack for the E2E matrix engine.
# Orchestrated by run.mjs, which sets TEST_MODE (selects modes/<mode>.env) and
# LK_IMAGE (OSS vs Plus). Ports match the apps' existing .env so no app rewiring
# is needed: lakekeeper :8181, keycloak :30080, openfga :35081, postgres :5432.
#
# Host networking note: lakekeeper reaches keycloak via host.docker.internal:30080
# (the *published* port) so the token issuer matches what the browser sees
# (http://localhost:30080). OPENID_ADDITIONAL_ISSUERS in the mode files accepts the
# localhost form too.

x-lk-common: &lk-common
  image: ${LK_IMAGE:-quay.io/lakekeeper/catalog:latest-main}
  env_file:
    - ./modes/${TEST_MODE:-authn}.env
  environment:
    # Injected from .env.secret by run.mjs (only the cedar mode needs it).
    LAKEKEEPER__LICENSE__KEY: ${LAKEKEEPER__LICENSE__KEY:-}
  volumes:
    # Cedar policy files. Harmless to mount in other modes.
    - ${CEDAR_POLICY_DIR}:/policies:ro
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16.4
    command: ["-c", "max_connections=10000"]
    environment:
      POSTGRES_PASSWORD: postgres
    # No host port published — only reached by lakekeeper over the compose network.
    # Avoids clashing with a dev postgres on :5432.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  openfga:
    image: openfga/openfga:v1.8
    command: run
    # No host ports — lakekeeper reaches it at openfga:8081 over the compose network.

  # S3-compatible object storage for warehouse tests (Silo, a maintained fork of
  # MinIO). Reached by lakekeeper at http://silo:9000 over the compose network;
  # the browser/LoQE use the host LAN IP that run.mjs injects.
  #
  # Silo serves the S3 API and the STS AssumeRole endpoint from one process with
  # no IAM config — the warehouse just points `sts-endpoint` at the same URL and
  # needs no role ARN. That is why this replaced SeaweedFS, whose AssumeRole
  # needed a hand-written s3.json with a role, a trust policy and a signing key.
  # Image and settings follow lakekeeper's own examples/minimal compose.
  silo:
    image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lakekeeper
      MINIO_ROOT_PASSWORD: lakekeeper-secret
      # LoQE reads and writes this bucket straight from the browser, so the S3
      # API has to answer cross-origin. MinIO/Silo takes this server-wide, which
      # replaces the per-bucket CORS rule bucket-init used to PUT.
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    healthcheck:
      # The image ships mc, so readiness is a real check rather than a retry loop.
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 10s
      retries: 5
      start_period: 15s
    ports:
      # Host port is configurable (run.mjs sets S3_LOCAL_HOST_PORT, default 8334)
      # so the e2e coexists with anything already holding :9000. The container
      # always listens on 9000; the warehouse endpoint uses host LAN IP + this.
      - "${S3_LOCAL_HOST_PORT:-8334}:9000" # S3 API (browser/LoQE)
      # The same S3 API on a port browsers refuse to connect to (Fetch standard's
      # bad-ports list). lakekeeper reaches it via the host LAN IP, the browser
      # does not — which is the asymmetry specs/storage/reachability.spec.ts needs
      # to prove the console blames the port rather than CORS.
      - "${S3_BADPORT_HOST_PORT:-10080}:9000"

  # One-shot: create the warehouse test bucket. Uses the silo image for its
  # bundled mc, so no second CLI image is pulled.
  bucket-init:
    image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    depends_on:
      silo:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local http://silo:9000 lakekeeper lakekeeper-secret &&
        mc mb --ignore-existing local/lakekeeper-test
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command:
      - start-dev
      - --import-realm
      - --health-enabled=true
      - --features=token-exchange
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ${KEYCLOAK_REALM_FILE}:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "30080:8080"

  # One-shot DB/authz migration. Run via `docker compose run --rm migrate`.
  migrate:
    <<: *lk-common
    command: migrate
    restart: "no"

  lakekeeper:
    <<: *lk-common
    command: serve
    ports:
      - "8181:8181"
    # Readiness is polled over HTTP by run.mjs (http://localhost:8181/health),
    # which avoids depending on the in-container binary path.
